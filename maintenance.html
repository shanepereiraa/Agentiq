<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>AgentIQ | Under Maintenance</title>
<meta name="theme-color" content="#07173a" />
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(180deg,#060c1e 0%,#08183a 55%,#060f28 100%);
    color: #f4f6fb;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo { width: 56px; height: 56px; margin-bottom: 28px; border-radius: 14px; }
  h1 {
    font-family: 'Space Grotesk', 'DM Sans', sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    margin: 0 0 14px;
    background: linear-gradient(135deg,#FF9F45,#22D3EE);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: rgba(244,246,251,0.75);
    max-width: 480px;
    margin: 0 0 8px;
  }
  .badge {
    margin-top: 24px;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: rgba(244,246,251,0.45);
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/logo.png" alt="AgentIQ" class="logo" onerror="this.style.display='none'" />
    <h1>Under Maintenance</h1>
    <p>We're making some improvements to AgentIQ right now. We'll be back online shortly — thanks for your patience.</p>
    <div class="badge">AgentIQ.co.in</div>
  </div>
</body>
</html>
